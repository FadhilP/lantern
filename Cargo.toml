[workspace]
resolver = "3"
members = ["crates/lantern-cli"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/FadhilP/lantern"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
unwrap_used = "warn"
allow_attributes = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
