[package]
name = "lantern-cli"
description = "Read-only code discovery for large codebases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "lantern"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
lantern-core = { path = "../lantern-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
dunce = "1"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1.0"
tempfile = "3"

[lints]
workspace = true
