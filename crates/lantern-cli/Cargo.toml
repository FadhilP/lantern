[package]
name = "lantern-cli"
description = "Read-only code discovery for large codebases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lantern"
path = "src/main.rs"

[dependencies]
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env"] }
dunce = "1.0"
gix = { version = "0.90", default-features = false, features = ["dirwalk", "index", "excludes", "sha1"] }
globset = "0.4"
ignore = "0.4"
rayon = "1.12"
regex = "1.13"
regex-syntax = "0.8"
rusqlite = { version = "0.41", features = ["bundled", "functions", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-dart = "0.3"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-php = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
zstd = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
